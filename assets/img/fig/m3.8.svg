<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signposts to the research frontier"><title>Signposts to the research frontier</title><style>.t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}.h{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}.ax{stroke:var(--line,#d5dde3);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="h" x="24" y="32">Signposts to the research frontier</text><line x1="120" y1="300" x2="120" y2="140" stroke="var(--muted,#5d6f7d)" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" values="-4 120 150;4 120 150;-4 120 150" dur="3.0s" repeatCount="indefinite"/><rect x="54" y="110" width="132" height="36" rx="6" fill="var(--economy,#8f3520)"/><text class="s" x="120" y="133" text-anchor="middle" style="fill:var(--paper,#fff)">FOUNDATION</text></g><line x1="285" y1="300" x2="285" y2="140" stroke="var(--muted,#5d6f7d)" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" values="-4 285 150;4 285 150;-4 285 150" dur="3.4s" repeatCount="indefinite"/><rect x="219" y="110" width="132" height="36" rx="6" fill="var(--water,#04505a)"/><text class="s" x="285" y="133" text-anchor="middle" style="fill:var(--paper,#fff)">WORLD</text></g><line x1="450" y1="300" x2="450" y2="140" stroke="var(--muted,#5d6f7d)" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" values="-4 450 150;4 450 150;-4 450 150" dur="3.8s" repeatCount="indefinite"/><rect x="384" y="110" width="132" height="36" rx="6" fill="var(--climate,#7a4412)"/><text class="s" x="450" y="133" text-anchor="middle" style="fill:var(--paper,#fff)">VERIFY</text></g><line x1="615" y1="300" x2="615" y2="140" stroke="var(--muted,#5d6f7d)" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" values="-4 615 150;4 615 150;-4 615 150" dur="4.2s" repeatCount="indefinite"/><rect x="549" y="110" width="132" height="36" rx="6" fill="var(--policy,#3f3266)"/><text class="s" x="615" y="133" text-anchor="middle" style="fill:var(--paper,#fff)">RARE</text></g><line x1="780" y1="300" x2="780" y2="140" stroke="var(--muted,#5d6f7d)" stroke-width="5"/><g><animateTransform attributeName="transform" type="rotate" values="-4 780 150;4 780 150;-4 780 150" dur="4.6s" repeatCount="indefinite"/><rect x="714" y="110" width="132" height="36" rx="6" fill="var(--land,#2f5a1c)"/><text class="s" x="780" y="133" text-anchor="middle" style="fill:var(--paper,#fff)">FAIR</text></g><text class="t" x="450" y="70" text-anchor="middle">five open research fronts</text><text class="s" x="450" y="335" text-anchor="middle">report every result with a baseline [and an interval]</text></svg>