<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A jam travelling between detectors"><title>A jam travelling between detectors</title><style>.t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}.h{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}.ax{stroke:var(--line,#d5dde3);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="h" x="24" y="32">A jam travelling between detectors</text><defs><linearGradient id="g31" x1="0" x2="1"><stop offset="0" stop-color="var(--land,#2f5a1c)" stop-opacity=".3"/><stop offset="0.3" stop-color="var(--climate,#7a4412)" stop-opacity=".9"><animate attributeName="offset" values="0.45;0.15;0.45" dur="7s" repeatCount="indefinite"/></stop><stop offset="0.5" stop-color="var(--land,#2f5a1c)" stop-opacity=".3"><animate attributeName="offset" values="0.6;0.3;0.6" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="var(--land,#2f5a1c)" stop-opacity=".3"/></linearGradient></defs><rect x="60" y="150" width="780" height="60" rx="8" fill="url(#g31)"/><g><rect x="194" y="110" width="12" height="40" fill="var(--ink,#14283a)"/><circle cx="200" cy="104" r="9" fill="var(--water,#04505a)"><animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></circle></g><g><rect x="594" y="110" width="12" height="40" fill="var(--ink,#14283a)"/><circle cx="600" cy="104" r="9" fill="var(--water,#04505a)"><animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></circle></g><text class="t" x="450" y="250" text-anchor="middle">a jam (brown) moves upstream between two detectors</text><text class="s" x="450" y="274" text-anchor="middle">the LWR model carries it where the sensors cannot see</text><text class="s" x="840" y="140" text-anchor="end">traffic →</text></svg>