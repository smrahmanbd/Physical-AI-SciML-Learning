<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A digital twin stays in step"><title>A digital twin stays in step</title><style>.t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}.h{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}.ax{stroke:var(--line,#d5dde3);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="h" x="24" y="32">A digital twin stays in step</text><rect x="60" y="90" width="300" height="200" rx="10" fill="var(--muted,#5d6f7d)" opacity=".14" stroke="var(--muted,#5d6f7d)" stroke-width="2"/><text class="t" x="210.0" y="195.0" text-anchor="middle"></text><rect x="540" y="90" width="300" height="200" rx="10" fill="var(--energy,#0b3954)" opacity=".14" stroke="var(--energy,#0b3954)" stroke-width="2"/><text class="t" x="690.0" y="195.0" text-anchor="middle"></text><text class="s" x="210" y="80" text-anchor="middle">real junction</text><text class="s" x="690" y="80" text-anchor="middle">digital twin</text><rect x="110" y="180" height="30" fill="var(--muted,#5d6f7d)" opacity=".8"><animate attributeName="width" values="40;180;60;40" dur="6s" repeatCount="indefinite"/></rect><rect x="590" y="180" height="30" fill="var(--energy,#0b3954)" opacity=".8"><animate attributeName="width" values="40;180;60;40" dur="6s" repeatCount="indefinite"/></rect><circle r="7" fill="var(--water,#04505a)"><animateMotion path="M360,140 L540,140" dur="1.5s" begin="0s" repeatCount="indefinite"/></circle><text class="s" x="450" y="128" text-anchor="middle">live data</text><circle r="7" fill="var(--policy,#3f3266)"><animateMotion path="M540,250 L360,250" dur="1.5s" begin="0.7s" repeatCount="indefinite"/></circle><text class="s" x="450" y="274" text-anchor="middle">tested actions</text><text class="s" x="450" y="330" text-anchor="middle">the twin's queue follows the real queue, corrected every cycle</text></svg>