<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time to collision counts down"><title>Time to collision counts down</title><style>.t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}.h{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}.ax{stroke:var(--line,#d5dde3);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="h" x="24" y="32">Time to collision counts down</text><line x1="60" y1="210" x2="840" y2="210" stroke="var(--muted,#5d6f7d)" stroke-width="3"/><rect y="186" width="60" height="22" rx="5" fill="var(--energy,#0b3954)"><animate attributeName="x" values="600;720" dur="6s" repeatCount="indefinite"/></rect><rect y="186" width="60" height="22" rx="5" fill="var(--climate,#7a4412)"><animate attributeName="x" values="150;640;655" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/></rect><text class="h" x="450" y="120" style="fill:var(--ink,#14283a)" opacity="0">TTC 6.0 s<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.3;0.4" dur="6s" begin="0.0s" repeatCount="indefinite"/></text><text class="h" x="450" y="120" style="fill:var(--ink,#14283a)" opacity="0">TTC 3.5 s<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.3;0.4" dur="6s" begin="1.4s" repeatCount="indefinite"/></text><text class="h" x="450" y="120" style="fill:var(--ink,#14283a)" opacity="0">TTC 1.8 s<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.3;0.4" dur="6s" begin="2.8s" repeatCount="indefinite"/></text><text class="h" x="450" y="120" style="fill:var(--climate,#7a4412)" opacity="0">TTC 1.2 s: conflict!<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.3;0.4" dur="6s" begin="4.199999999999999s" repeatCount="indefinite"/></text><text class="t" x="450" y="270" text-anchor="middle">time to collision = gap ÷ closing speed</text><text class="s" x="450" y="296" text-anchor="middle">near misses are counted to estimate risk before crashes happen</text></svg>