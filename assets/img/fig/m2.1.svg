<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A SciML project, step by step"><title>A SciML project, step by step</title><style>.t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}.h{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}.ax{stroke:var(--line,#d5dde3);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="h" x="24" y="32">A SciML project, step by step</text><rect x="60" y="120" width="100" height="56" rx="10" fill="var(--policy,#3f3266)" opacity=".14" stroke="var(--policy,#3f3266)" stroke-width="2"/><text class="t" x="110.0" y="153.0" text-anchor="middle">1. Question</text><rect x="180" y="120" width="100" height="56" rx="10" fill="var(--water,#04505a)" opacity=".14" stroke="var(--water,#04505a)" stroke-width="2"/><text class="t" x="230.0" y="153.0" text-anchor="middle">2. Data</text><rect x="300" y="120" width="100" height="56" rx="10" fill="var(--climate,#7a4412)" opacity=".14" stroke="var(--climate,#7a4412)" stroke-width="2"/><text class="t" x="350.0" y="153.0" text-anchor="middle">3. Split</text><rect x="420" y="120" width="100" height="56" rx="10" fill="var(--land,#2f5a1c)" opacity=".14" stroke="var(--land,#2f5a1c)" stroke-width="2"/><text class="t" x="470.0" y="153.0" text-anchor="middle">4. Baseline</text><rect x="540" y="120" width="100" height="56" rx="10" fill="var(--economy,#8f3520)" opacity=".14" stroke="var(--economy,#8f3520)" stroke-width="2"/><text class="t" x="590.0" y="153.0" text-anchor="middle">5. Build</text><rect x="660" y="120" width="100" height="56" rx="10" fill="var(--climate,#7a4412)" opacity=".14" stroke="var(--climate,#7a4412)" stroke-width="2"/><text class="t" x="710.0" y="153.0" text-anchor="middle">6. Validate</text><rect x="780" y="120" width="100" height="56" rx="10" fill="var(--land,#2f5a1c)" opacity=".14" stroke="var(--land,#2f5a1c)" stroke-width="2"/><text class="t" x="830.0" y="153.0" text-anchor="middle">7. Share</text><circle r="7" fill="var(--ink,#14283a)"><animateMotion path="M60,100 L880,100" dur="7s" begin="0s" repeatCount="indefinite"/></circle><rect x="80" y="240" width="500" height="26" fill="var(--land,#2f5a1c)" opacity=".7"/><rect x="580" y="240" width="130" height="26" fill="var(--climate,#7a4412)" opacity=".7"/><rect x="710" y="240" width="130" height="26" fill="var(--policy,#3f3266)" opacity=".7"/><text class="s" x="330" y="258" text-anchor="middle" style="fill:var(--paper,#fff)">train (the past)</text><text class="s" x="645" y="258" text-anchor="middle" style="fill:var(--paper,#fff)">validate</text><text class="s" x="775" y="258" text-anchor="middle" style="fill:var(--paper,#fff)">test (last)</text><text class="s" x="460" y="300" text-anchor="middle">time →  split time series by time, never at random</text></svg>